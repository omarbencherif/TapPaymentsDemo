<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tap Payments - Quick Test</title>
  <script src="https://tap-sdks.b-cdn.net/card/1.0.2/index.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f7fa;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h1 { color: #667eea; margin-top: 0; }
    #card-element { margin: 20px 0; min-height: 200px; }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover { opacity: 0.9; }
    .result {
      margin-top: 20px;
      padding: 15px;
      background: #f0f0f0;
      border-radius: 6px;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 Tap SDK Quick Test</h1>
    <p>This is a simple test to verify the Tap Card SDK loads correctly.</p>

    <div>
      <label><strong>Public Key:</strong></label>
      <input type="text" id="pk" placeholder="pk_test_..." style="width: 100%; padding: 8px; margin: 5px 0;">
    </div>

    <div style="margin-top: 10px;">
      <label><strong>Merchant ID:</strong></label>
      <input type="text" id="mid" placeholder="Merchant ID" style="width: 100%; padding: 8px; margin: 5px 0;">
    </div>

    <button onclick="initSDK()">Initialize SDK</button>

    <div id="card-element"></div>

    <button onclick="testTokenize()" id="tokenizeBtn" style="display:none;">Tokenize Card</button>

    <div id="result" class="result" style="display:none;"></div>
  </div>

  <script>
    let tokenize;

    function initSDK() {
      const publicKey = document.getElementById('pk').value;
      const merchantId = document.getElementById('mid').value;

      if (!publicKey || !merchantId) {
        alert('Please enter Public Key and Merchant ID');
        return;
      }

      const { renderTapCard, Theme, Currencies, Locale } = window.CardSDK;

      const result = renderTapCard('card-element', {
        publicKey: publicKey,
        merchant: { id: merchantId },
        transaction: {
          amount: 1,
          currency: Currencies.KWD
        },
        acceptance: {
          supportedBrands: ['VISA', 'MASTERCARD', 'AMERICAN_EXPRESS', 'MADA'],
          supportedCards: "ALL"
        },
        fields: { cardHolder: true },
        addons: {
          displayPaymentBrands: true,
          loader: true,
          saveCard: true
        },
        interface: {
          locale: Locale.EN,
          theme: Theme.LIGHT
        },
        onReady: () => {
          console.log('✅ SDK Ready');
          document.getElementById('tokenizeBtn').style.display = 'block';
        },
        onSuccess: (data) => {
          console.log('✅ Success:', data);
          document.getElementById('result').textContent = JSON.stringify(data, null, 2);
          document.getElementById('result').style.display = 'block';
        },
        onError: (error) => {
          console.error('❌ Error:', error);
          alert('Error: ' + JSON.stringify(error));
        }
      });

      tokenize = window.CardSDK.tokenize;
    }

    function testTokenize() {
      if (tokenize) {
        tokenize();
      }
    }
  </script>
</body>
</html>
